<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="gradRoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradModal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gradTab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <text x="600" y="45" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="0.5">SƠ ĐỒ CẤU TRÚC THÀNH PHẦN (COMPONENT TREE) WEBSITE MÔ PHỎNG</text>
  <text x="600" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">Kiến trúc Single Page Application (SPA) – HTML5, Tailwind CSS, Vanilla JS &amp; Vector SVG</text>

  <!-- ROOT NODE -->
  <g filter="url(#shadow)">
    <rect x="440" y="100" width="320" height="64" rx="12" fill="url(#gradRoot)" />
    <text x="600" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Trang Web SPA (index.html)</text>
    <text x="600" y="148" text-anchor="middle" font-size="12" fill="#bae6fd">Giao diện đơn trang chính &amp; Khung điều hướng</text>
  </g>

  <!-- CONNECTING LINES FROM ROOT -->
  <path d="M600 164 L600 195 M130 195 L1070 195" stroke="#94a3b8" stroke-width="2" fill="none" />
  
  <path d="M130 195 L130 230" stroke="#94a3b8" stroke-width="2" fill="none" />
  <path d="M315 195 L315 230" stroke="#94a3b8" stroke-width="2" fill="none" />
  <path d="M510 195 L510 230" stroke="#94a3b8" stroke-width="2" fill="none" />
  <path d="M730 195 L730 230" stroke="#0284c7" stroke-width="2.5" fill="none" />
  <path d="M925 195 L925 230" stroke="#94a3b8" stroke-width="2" fill="none" />
  <path d="M1070 195 L1070 230" stroke="#94a3b8" stroke-width="2" fill="none" />

  <!-- LEVEL 1 CARDS -->
  <!-- 1. Header -->
  <g filter="url(#shadow)">
    <rect x="45" y="230" width="170" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="45" y="230" width="170" height="6" rx="3" fill="#3b82f6" />
    <text x="130" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Header &amp; Navigation</text>
    <text x="130" y="280" text-anchor="middle" font-size="11" fill="#64748b">Logo, Loading Bar, Timer</text>
    <text x="130" y="295" text-anchor="middle" font-size="10" fill="#94a3b8">Quick Jump Selector</text>
  </g>

  <!-- 2. Hero Section -->
  <g filter="url(#shadow)">
    <rect x="230" y="230" width="170" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="230" y="230" width="170" height="6" rx="3" fill="#3b82f6" />
    <text x="315" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Hero Section</text>
    <text x="315" y="280" text-anchor="middle" font-size="11" fill="#64748b">Banner giới thiệu đề tài</text>
    <text x="315" y="295" text-anchor="middle" font-size="10" fill="#94a3b8">Thống kê 6 quy trình</text>
  </g>

  <!-- 3. Process Cards -->
  <g filter="url(#shadow)">
    <rect x="420" y="230" width="180" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="420" y="230" width="180" height="6" rx="3" fill="#3b82f6" />
    <text x="510" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Danh Mục 6 Quy Trình</text>
    <text x="510" y="278" text-anchor="middle" font-size="11" fill="#64748b">Bộ lọc: Quản lý/Cốt lõi/Hỗ trợ</text>
    <text x="510" y="295" text-anchor="middle" font-size="10" fill="#94a3b8">Tìm kiếm theo từ khóa</text>
  </g>

  <!-- 4. MODAL CHI TIẾT QUY TRÌNH (FOCUS NODE) -->
  <g filter="url(#shadow)">
    <rect x="620" y="230" width="200" height="75" rx="10" fill="url(#gradModal)" stroke="#0f766e" stroke-width="1.5" />
    <text x="720" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Modal Chi Tiết Quy Trình</text>
    <text x="720" y="276" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#ccfbf1">js/app.js</text>
    <text x="720" y="294" text-anchor="middle" font-size="10" fill="#ffffff">Xử lý Tabs &amp; Trình xem tương tác</text>
  </g>

  <!-- 5. Data Module -->
  <g filter="url(#shadow)">
    <rect x="840" y="230" width="170" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="840" y="230" width="170" height="6" rx="3" fill="#f59e0b" />
    <text x="925" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Module Dữ Liệu Tĩnh</text>
    <text x="925" y="278" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#d97706">js/data.js</text>
    <text x="925" y="295" text-anchor="middle" font-size="10" fill="#64748b">Lưu trữ 6 quy trình &amp; các bước</text>
  </g>

  <!-- 6. SVG Assets -->
  <g filter="url(#shadow)">
    <rect x="1030" y="230" width="145" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="1030" y="230" width="145" height="6" rx="3" fill="#f59e0b" />
    <text x="1102" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Kho Sơ Đồ SVG</text>
    <text x="1102" y="278" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#d97706">assets/bpmn/*.svg</text>
    <text x="1102" y="295" text-anchor="middle" font-size="10" fill="#64748b">8 sơ đồ AS-IS &amp; TO-BE</text>
  </g>

  <!-- BRANCH LINES FROM MODAL TO 4 TABS -->
  <path d="M720 305 L720 350 M320 350 L1040 350" stroke="#0d9488" stroke-width="2" fill="none" />
  <path d="M320 350 L320 380" stroke="#0d9488" stroke-width="2" fill="none" />
  <path d="M560 350 L560 380" stroke="#0d9488" stroke-width="2" fill="none" />
  <path d="M800 350 L800 380" stroke="#0d9488" stroke-width="2" fill="none" />
  <path d="M1040 350 L1040 380" stroke="#0d9488" stroke-width="2" fill="none" />

  <!-- 4 TABS -->
  <!-- Tab 1 -->
  <g filter="url(#shadow)">
    <rect x="220" y="380" width="200" height="120" rx="10" fill="url(#gradTab)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="220" y="380" width="200" height="32" rx="8" fill="#e2e8f0" />
    <text x="320" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Tab 1: Tổng Quan Quy Trình</text>
    <text x="235" y="432" font-size="11" fill="#334155">• Bảng thông tin mục tiêu</text>
    <text x="235" y="452" font-size="11" fill="#334155">• Ma trận tác nhân tham gia</text>
    <text x="235" y="472" font-size="11" fill="#334155">• Đầu vào &amp; Đầu ra (I/O)</text>
    <text x="235" y="492" font-size="11" fill="#64748b">• Biểu mẫu / Hệ thống CNTT</text>
  </g>

  <!-- Tab 2 -->
  <g filter="url(#shadow)">
    <rect x="460" y="380" width="200" height="120" rx="10" fill="url(#gradTab)" stroke="#38bdf8" stroke-width="2" />
    <rect x="460" y="380" width="200" height="32" rx="8" fill="#e0f2fe" />
    <text x="560" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">Tab 2: Sơ Đồ BPMN 2.0</text>
    <text x="475" y="432" font-size="11" fill="#334155">• Trình xem HD Vector SVG</text>
    <text x="475" y="452" font-size="11" fill="#334155">• Phóng to / Thu nhỏ (Zoom)</text>
    <text x="475" y="472" font-size="11" fill="#334155">• Kéo thả di chuyển (Pan)</text>
    <text x="475" y="492" font-size="11" fill="#0284c7" font-weight="600">• Chế độ Toàn màn hình</text>
  </g>

  <!-- Tab 3 -->
  <g filter="url(#shadow)">
    <rect x="700" y="380" width="200" height="120" rx="10" fill="url(#gradTab)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="700" y="380" width="200" height="32" rx="8" fill="#e2e8f0" />
    <text x="800" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Tab 3: Mô Phỏng Từng Bước</text>
    <text x="715" y="432" font-size="11" fill="#334155">• Stepper điều khiển Next/Prev</text>
    <text x="715" y="452" font-size="11" fill="#334155">• Highlight tác nhân phụ trách</text>
    <text x="715" y="472" font-size="11" fill="#334155">• Mô tả chi tiết hành động</text>
    <text x="715" y="492" font-size="11" fill="#64748b">• Thanh tiến trình (Progress Bar)</text>
  </g>

  <!-- Tab 4 -->
  <g filter="url(#shadow)">
    <rect x="940" y="380" width="200" height="120" rx="10" fill="url(#gradTab)" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="940" y="380" width="200" height="32" rx="8" fill="#e2e8f0" />
    <text x="1040" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Tab 4: So Sánh AS-IS / TO-BE</text>
    <text x="955" y="432" font-size="11" fill="#334155">• Đối chiếu trực tiếp trước/sau</text>
    <text x="955" y="452" font-size="11" fill="#334155">• Đo lường loại bỏ lãng phí NVA</text>
    <text x="955" y="472" font-size="11" fill="#334155">• Đánh giá thời gian &amp; sai sót</text>
    <text x="955" y="492" font-size="11" fill="#16a34a" font-weight="600">• Chỉ số cải tiến hiệu suất</text>
  </g>

  <!-- FOOTER NOTE -->
  <rect x="300" y="540" width="600" height="40" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="600" y="565" text-anchor="middle" font-size="12" fill="#475569">💡 Cấu trúc module rõ ràng, phân tách mạch lạc giữa Tầng giao diện, Tầng điều khiển và Tầng dữ liệu</text>
</svg>